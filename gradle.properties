org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true

# App-Version für lokale Builds (CI nimmt die Version aus dem Git-Tag, z. B. v1.2.0)
appVersion=1.2.0
# GitHub-Repo für den Update-Check (CI setzt das automatisch). Für lokale Builds anpassen:
updateRepo=Schnillonski/life-counter

# Release-Schlüssel für lokale Builds (NICHT committen – besser in ~/.gradle/gradle.properties eintragen):
#LC_KEYSTORE=/home/DEIN_USER/keys/lifecounter.jks
#LC_KEYSTORE_PASSWORD=...
#LC_KEY_ALIAS=lifecounter
#LC_KEY_PASSWORD=...

# ---- Linux arm64 (z. B. Asahi Linux auf Apple Silicon) ----
# Google liefert aapt2 für Linux nur als x86_64. Auf arm64 eine native aapt2
# (z. B. aus https://github.com/lzhiyong/android-sdk-tools/releases) herunterladen
# und hier den Pfad eintragen (Zeile einkommentieren):
#android.aapt2FromMavenOverride=/home/DEIN_USER/android-sdk-tools/aapt2
